<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5F52">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>روتين البيت</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF3F0;--surface:#FFFFFF;--ink:#14302A;--muted:#5C766E;--line:#D3DFDA;
  --primary:#0F6B5C;--primary-ink:#FFFFFF;--sun:#F0B03A;--sun-ink:#2A2008;
  --danger:#B93D34;--danger-soft:#F8E0DC;--ok:#2E8B57;--warn-soft:#FBEFCF;
  --hero-bg:#0F5F52;--hero-ink:#F3FBF8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C19;--surface:#162925;--ink:#E5F0EC;--muted:#8DAEA4;--line:#27403A;
    --primary:#3DBBA3;--primary-ink:#06231D;--sun:#F2BE55;--sun-ink:#2A2008;
    --danger:#EE7C73;--danger-soft:#3B1F1C;--ok:#54C283;--warn-soft:#3A3116;
    --hero-bg:#1B5549;--hero-ink:#ECFAF5;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C19;--surface:#162925;--ink:#E5F0EC;--muted:#8DAEA4;--line:#27403A;
  --primary:#3DBBA3;--primary-ink:#06231D;--sun:#F2BE55;--sun-ink:#2A2008;
  --danger:#EE7C73;--danger-soft:#3B1F1C;--ok:#54C283;--warn-soft:#3A3116;
  --hero-bg:#1B5549;--hero-ink:#ECFAF5;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.shell{max-width:560px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
h1,h2,h3{line-height:1.3}
h2{font-size:20px;font-weight:700;margin:26px 0 10px}
small,.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;background:var(--primary);color:var(--primary-ink);text-align:center}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.big{min-height:66px;font-size:21px;border-radius:20px}
.ib{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.in{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea.in{min-height:76px;resize:vertical}
.lbl{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 label{cursor:pointer}
.seg3 input{position:absolute;opacity:0;pointer-events:none}
.seg3 span{display:block;text-align:center;padding:11px 6px;border-radius:12px;border:1.5px solid var(--line);font-weight:500}
.seg3 input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg3 input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--primary)}
.err{color:var(--danger);font-size:14px;min-height:22px;margin-top:10px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:30px;padding:22px 20px 20px;display:grid;grid-template-columns:auto 1fr;gap:18px 20px;align-items:center}
.hero small{color:inherit;opacity:.78}
.hero h1{font-size:23px;font-weight:700}
.hero .sub{opacity:.85;margin-top:2px}
.hero .cta{grid-column:1/-1}
.ringbox{position:relative;width:124px;height:124px}
.ring{width:124px;height:124px}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .rt{stroke:rgba(255,255,255,.17)}
.ring .ra{stroke:var(--sun);transition:stroke-dasharray .6s ease}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring-c b{font-size:32px}
.ring-c span{font-size:13px;opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{background:var(--warn-soft);border-radius:14px;padding:11px 14px;font-size:14px;margin-top:14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line);color:var(--ink)}
.badge.late{background:var(--danger-soft);color:var(--danger)}
.badge.ok{background:var(--line);color:var(--muted)}

/* task rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.trow:last-child{border-bottom:0}
.trow b{font-weight:600;display:block}
.trow small{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.trow.done b{text-decoration:line-through;color:var(--muted)}
.trow.off{opacity:.5}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;background:var(--bg)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.gh{font-weight:700;font-size:15px;margin:20px 0 6px;color:var(--muted)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:44px;display:block;margin-bottom:6px}

/* tab bar */
.tabbar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar div{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--primary);font-weight:700}
.fab{position:fixed;inset-inline-start:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;min-height:52px;padding:0 22px;border-radius:26px;background:var(--sun);color:var(--sun-ink);font-weight:700;border:0}

/* overlays */
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto}
.ov-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}
.wz-top{display:flex;align-items:center;gap:12px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.d{background:var(--primary)}
.segs i.c{background:var(--sun)}
.wz-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px 0}
.wz-ico{width:104px;height:104px;border-radius:34px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:54px}
.wz-main h1{font-size:31px;font-weight:700;max-width:14em}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.wz-note{color:var(--muted);max-width:22em}
.wz-bot{display:grid;gap:12px}
.wz-bot .two{gap:12px}
.okmark{width:112px;height:112px}
.okmark circle{fill:var(--ok)}
.okmark path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .1s ease forwards}
.okmark{animation:pop .35s ease}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-bg{position:fixed;inset:0;background:rgba(8,22,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease;touch-action:pan-y}
.sheet-handle{width:40px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 14px;touch-action:none}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .acts{display:flex;gap:10px;margin-top:22px}
.sheet .acts .btn{flex:1}
#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:16px;align-items:center;max-width:520px;animation:up .2s ease}
.toast button{color:var(--sun);font-weight:700}

/* misc */
.brand{text-align:center;padding:34px 0 10px}
.brand .mark{width:76px;height:76px;border-radius:26px;background:var(--hero-bg);display:inline-flex;align-items:center;justify-content:center;font-size:40px}
.brand h1{font-size:28px;margin-top:12px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;margin:18px 0}
.tabs2 button{padding:10px;border-radius:11px;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:var(--surface);color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--primary);min-height:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{font-size:28px;display:block;line-height:1.2}
.pbar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:5px}
.arow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.ai{font-size:26px;width:38px;text-align:center}
.code{font-size:30px;font-weight:700;letter-spacing:.25em;text-align:center;direction:ltr;padding:14px;background:var(--bg);border-radius:14px;border:1.5px dashed var(--line)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.head h1{font-size:22px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.srow:last-child{border-bottom:0}
.icons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.icons button{width:42px;height:42px;font-size:22px;border-radius:12px;border:1.5px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stp{display:flex;align-items:center;gap:12px}.stp b{min-width:24px;text-align:center;font-size:19px}
.stp .ib{font-size:20px}
</style>
</head>

function buildRoutine(today) {

  const dueNow = list.filter(t => t.nextDue === today);
  const over = list.filter(t => t.nextDue < today).sort((a, b) => score(b, today) - score(a, today));
  const must = over.filter(t => t.priority === 'high');

  let left = minutes; const pick = [];

function completeTask(t, minutes) {
  const today = S.today, next = t.freq ? nextAfter(t.freq, today) : (t.nextDue || null);

  const b = db.batch();
  b.set(cref, {
    taskId: t.id, title: t.title, areaId: t.areaId || null, deviceId: t.deviceId || null, userId: S.user.uid, userName: myName(),
    completedAt: FV.serverTimestamp(), date: today, scheduledDate: t.nextDue || today,
    actualMinutes: minutes || t.estimatedMinutes || null, estimatedMinutes: t.estimatedMinutes || null

  const upd = { lastCompletedDate: today, lastCompletedAt: FV.serverTimestamp(), nextDue: next };
  if (t.triggerType === 'afterUse' || t.triggerType === 'afterCycle') upd.pendingSince = null;
  if (t.triggerType === 'conditionBased') upd.conditionState = 'ok';
  b.update(taskRef(t.id), upd);

  return () => {

    const undoUpd = { lastCompletedDate: prev.last, lastCompletedAt: prev.lastAt, nextDue: prev.next };
    if (t.triggerType === 'afterUse' || t.triggerType === 'afterCycle') undoUpd.pendingSince = prev.pendingSince;
    if (t.triggerType === 'conditionBased') undoUpd.conditionState = prev.conditionState;
    u.update(taskRef(t.id), undoUpd);
    if (S.routine && inRoutine(t.id)) u.update(routineRef(), { doneIds: FV.arrayRemove(t.id) });
    u.commit().catch(e => console.error(e));

        <div class="ring-c"><b>${done}</b><span>من ${total}</span></div></div>

      </div></div></div>`;

  const bottom = w.post
    ? `<div class="wz-bot"><button class="btn big block sun" data-act="wz-done">${tr('wizard.done')}</button>

  return `<div class="ov"><div class="ov-in">${top}<div class="wz-main">
    <div class="wz-ico">${a.icon || '🧹'}</div><small>${esc(a.name || '')}</small>

function startWizard(mode, ids) {
  ids = ids.filter(id => taskById(id));
  if (!ids.length) { toast(tr('home.noTasksToday')); return; }
  S.wz = { mode, ids, i: 0, t0: Date.now(), phase: 'task', done: 0, mins: 0, post: false, token: 0 };
  render();
}
function wzAdvance() {
  const w = S.wz; if (!w) return;
  w.post = false;
  do { w.i++; } while (w.i < w.ids.length && !taskById(w.ids[w.i]));
  w.phase = w.i >= w.ids.length ? 'finish' : 'task';
  w.t0 = Date.now();
  render();
}
/* ---------- Wizard prev/next: lightweight "peek" navigation, doesn't change completion state ---------- */
function wizSwipePrev() {
  const w = S.wz; if (!w || w.i <= 0) return;
  let px = w.i - 1; while (px > 0 && !taskById(w.ids[px])) px--;
  w.i = px; w.phase = 'task'; w.post = false; w.t0 = Date.now(); render();
}
function wizSwipeNext() {
  const w = S.wz; if (!w || w.phase !== 'task') return;
  wzAdvance();
}
function wzDone() {
  const w = S.wz, t = taskById(w.ids[w.i]); if (!t || w.phase !== 'task') return;
  const est = t.estimatedMinutes || 5;
  let m = Math.max(1, Math.round((Date.now() - w.t0) / 60000));
  if (m > Math.max(30, est * 4)) m = est;
  completeTask(t, m);
  w.done++; w.mins += m; w.phase = 'ok'; w.post = false;
  const tk = ++w.token;
  render();
  setTimeout(() => { if (S.wz && S.wz.token === tk && S.wz.phase === 'ok') wzAdvance(); }, 1100);
}

function freqExtra(kind, f) {
  if (kind === 'custom') return `<label class="lbl" for="fx-n">${tr('freq.every')}</label><div class="two"><input id="fx-n" class="in" type="number" min="1" max="365" value="${f.n || 1}"><select id="fx-u" class="in"><option value="day" ${f.unit === 'day' ? 'selected' : ''}>${tr('freq.day')}</option><option value="month" ${f.unit === 'month' ? 'selected' : ''}>${tr('freq.month')}</option></select></div>`;
  if (kind === 'weekday') return `<label class="lbl" for="fx-n">${tr('freq.whatDay')}</label><select id="fx-n" class="in">${DAYS.map((d, i) => `<option value="${i}" ${f.n === i ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
  if (kind === 'monthday') return `<label class="lbl" for="fx-n">${tr('freq.whatDayOfMonth')}</label><input id="fx-n" class="in" type="number" min="1" max="31" value="${f.n || 1}">`;
  return '';
}
function freqKind(f) {
  const k = `${f.unit}:${f.n}`;
  if (PRESETS.some(p => p[0] === k)) return k;
  return f.unit === 'weekday' ? 'weekday' : f.unit === 'monthday' ? 'monthday' : 'custom';
}
function readFreq() {
  const v = $('#f-sel').value;
  if (v === 'custom') return { unit: $('#fx-u').value, n: clamp(1, 365, Math.round(+$('#fx-n').value || 1)) };
  if (v === 'weekday') return { unit: 'weekday', n: +$('#fx-n').value };
  if (v === 'monthday') return { unit: 'monthday', n: clamp(1, 31, Math.round(+$('#fx-n').value || 1)) };
  return parseFreq(v);
}

async function saveTask(id) {
  const title = $('#f-title').value.trim();
  if (!title) { toast(tr('tasks.needTitle')); return; }
  const old = id ? taskById(id) : null;
  const calendarBased = !old || !old.triggerType || CALENDAR_TRIGGERS.has(old.triggerType);
  const data = {
    title,
    estimatedMinutes: clamp(1, 240, Math.round(+$('#f-min').value || 5)),
    priority: document.querySelector('input[name=pr]:checked').value,
    assignedTo: $('#f-as').value || null, note: $('#f-note').value.trim(), active: $('#f-act').checked
  };
  const areaSel = $('#f-area'); if (areaSel) data.areaId = areaSel.value;
  if (calendarBased) {
    data.freq = readFreq();
    if (id) {
      if (JSON.stringify((old.freq) || {}) !== JSON.stringify(data.freq)) {
        data.nextDue = old.lastCompletedDate ? nextAfter(data.freq, old.lastCompletedDate) : onOrAfter(data.freq, S.today);
      }
    }
  }
  try {
    if (id) {
      data.isCustomized = true;
      await taskRef(id).update(data);
    } else {
      if (!data.freq) data.freq = readFreq();
      data.nextDue = onOrAfter(data.freq, S.today); data.lastCompletedDate = null; data.isCustomized = false; data.createdAt = FV.serverTimestamp();
      await homeRef().collection('tasks').add(data);
    }
    closeSheet(); toast('اتحفظت المهمة');
  } catch (e) { console.error(e); toast(tr('tasks.saveErr')); }
}

/* ---------- Stats ---------- */
async function loadStats() {
  if (S.statsLoading) return;
  S.statsLoading = true; S.stats = null; render();
  const from = addDays(S.today, -6), hr = homeRef();
  try {
    const [cs, rs] = await Promise.all([
      hr.collection('taskCompletions').where('date', '>=', from).get(),
      hr.collection('dailyRoutines').where('date', '>=', from).get()
    ]);
    const comps = cs.docs.map(d => d.data()), routines = rs.docs.map(d => d.data());
    const days = [...Array(7)].map((_, i) => addDays(from, i));
    const byDay = Object.fromEntries(days.map(d => [d, 0]));
    const byUser = {};
    comps.forEach(c => { if (byDay[c.date] != null) byDay[c.date]++; byUser[c.userName || '—'] = (byUser[c.userName || '—'] || 0) + 1; });
    const map = new Map(S.tasks.map(t => [t.id, t]));
    let tot = 0, dn = 0, missed = 0, fullDays = 0; const area = {};
    routines.forEach(r => {
      const post = new Set(r.postponedIds || []), done = new Set(r.doneIds || []), sk = new Set(r.skippedIds || []);
      const ids = (r.ids || []).filter(id => !post.has(id));
      const today = r.date === S.today;
      ids.forEach(id => {
        const resolved = done.has(id) || sk.has(id);
        if (today && !resolved) return;
        tot++; if (done.has(id)) dn++; else if (sk.has(id)) missed++;
        const t = map.get(id); if (t) { const a = area[t.areaId] || (area[t.areaId] = { t: 0, d: 0 }); a.t++; if (done.has(id)) a.d++; }
      });
      if (ids.length && ids.every(id => done.has(id) || sk.has(id))) fullDays++;
    });
    S.stats = {
      completed: comps.length, minutes: comps.reduce((s, c) => s + (c.actualMinutes || 0), 0),
      missed, rate: tot ? Math.round(dn / tot * 100) : null, fullDays, days, byDay, byUser, area,
      overdue: activeTasks().filter(t => t.nextDue < S.today).length
    };
  } catch (e) { console.error(e); S.stats = { error: true }; }
  S.statsLoading = false; render();
}

const nRooms = n => S.lang === 'en' ? (n === 1 ? '1 room' : `${n} rooms`) : (n === 1 ? 'غرفة' : n === 2 ? 'غرفتين' : (n >= 3 && n <= 10) ? `${n} غرف` : `${n} غرفة`);

// English names for the built-in room templates, positionally parallel to TEMPLATES.
// Custom / user-edited templates keep whatever language they were written in (see libraryTypes below).
const TEMPLATES_EN = {
  bedroom: { name: 'Bedroom', tasks: [
    'Make the bed', 'Pick clothes up off the floor', 'Take cups & plates out of the room', 'Change the bed sheets', 'Dust surfaces',
    'Vacuum & mop the floor', 'Clean under the bed', 'Organize the wardrobe', 'Clean the AC filters'] },

    'Clean the microwave', 'Wipe cabinet handles', 'Mop the kitchen floor', 'Clean the fridge', 'Clean inside the cabinets'] },
  bathroom: { name: 'Bathroom', tasks: [

  living: { name: 'Living Room', tasks: [

function libraryTypes() {
  const over = new Map(S.roomTypes.map(t => [t.id, t]));
  const out = TEMPLATES.map(T => {
    const o = over.get(T.key);
    if (o) return { ...o, id: T.key, builtin: true, edited: true, tasks: o.tasks || [] };
    const en = TEMPLATES_EN[T.key];
    return {
      id: T.key, name: (S.lang === 'en' && en) ? en.name : T.name, icon: T.icon, builtin: true,
      tasks: T.tasks.map(([title, fs, min, pr, note], i) => ({ key: `${T.key}_${i}`, title: (S.lang === 'en' && en && en.tasks[i]) ? en.tasks[i] : title, freq: parseFreq(fs), minutes: min, priority: PRI_MAP[pr], note: note || '' }))
    };

  S.roomTypes.filter(t => !TEMPLATES.some(T => T.key === t.id)).forEach(t => out.push({ ...t, custom: true, tasks: t.tasks || [] }));
  return out;

// Live re-localization for a stored task instance: its `title` is frozen in whatever language it
// was created in, but if it came from a template we still have (templateKey), prefer that template's
// *current-language* title so switching languages relocalizes generated tasks instantly. Falls back
// to the frozen stored title for custom tasks, legacy tasks, or a template that's since been deleted.
function displayTitle(task) {
  if (!task) return '';
  // A hand-renamed task is customized (isCustomized=true), so its own stored title always wins —
  // otherwise a rename would keep getting silently overridden by the template's title on every
  // render, even though the Firestore write itself succeeded (this was exactly that bug).
  if (task.templateKey && !task.isCustomized) {
    const pools = task.deviceId ? [deviceTypeLibrary(), libraryTypes()] : [libraryTypes(), deviceTypeLibrary()];
    for (const pool of pools) for (const type of pool) {
      const hit = type.tasks.find(x => x.key === task.templateKey);
      if (hit) return hit.title;
    }
  }
  return task.title;
}

function taskFromTpl(tt, areaId, today, sp) {
  const f = tt.freq, p = periodDays(f), off = p > 1 ? (sp.n++) % Math.min(p, 7) : 0;
  return { title: tt.title, areaId, templateKey: tt.key || null, freq: f, estimatedMinutes: tt.minutes || 5, priority: tt.priority || 'normal', active: true,
    assignedTo: null, note: tt.note || '', lastCompletedDate: null, nextDue: onOrAfter(f, addDays(today, off)), createdAt: FV.serverTimestamp() };

async function createRooms(hr, list) {
  const b = db.batch(), today = S.today || todayStr(), sp = { n: 0 };
  let order = S.areas.reduce((m, a) => Math.max(m, a.order ?? 0), -1) + 1;
  list.forEach(r => {
    const ar = hr.collection('areas').doc(), tasks = r.tasks || [];
    b.set(ar, { name: r.name, icon: r.icon, typeId: r.typeId || null, appliedKeys: (r.keys || tasks.map(t => t.key)).filter(Boolean), order: order++, active: true, createdAt: FV.serverTimestamp() });
    tasks.forEach(tt => b.set(hr.collection('tasks').doc(), taskFromTpl(tt, ar.id, today, sp)));
  });
  await b.commit();
}
function nextRoomName(type) {
  const used = new Set(S.areas.map(a => a.name));
  if (!used.has(type.name)) return type.name;
  let i = S.areas.filter(a => areaTypeId(a) === type.id).length + 1;
  while (used.has(`${type.name} ${i}`)) i++;
  return `${type.name} ${i}`;

function missingFor(type) {
  const out = [];
  S.areas.filter(a => areaTypeId(a) === type.id).forEach(a => {
    const applied = new Set(a.appliedKeys || []), mine = S.tasks.filter(t => t.areaId === a.id);
    const ms = type.tasks.filter(tt => !applied.has(tt.key) && !mine.some(t => t.templateKey === tt.key || t.title === tt.title));
    if (ms.length) out.push({ area: a, miss: ms });
  });
  return out;
}
async function syncType(type) {
  const miss = missingFor(type); if (!miss.length) return;
  const b = db.batch(), hr = homeRef(), today = S.today || todayStr(), sp = { n: 0 };
  miss.forEach(({ area, miss: ms }) => {
    ms.forEach(tt => b.set(hr.collection('tasks').doc(), taskFromTpl(tt, area.id, today, sp)));
    b.update(hr.collection('areas').doc(area.id), { appliedKeys: FV.arrayUnion(...type.tasks.map(t => t.key).filter(Boolean)) });
  });
  await b.commit();
}

/* =====================================================================
   Reset Center — two distinct, non-confusable operations:
     1. Reset Task History  — clears completion/usage/season-routine LOGS
        and the per-task completion fields (lastCompletedDate/At). The
        SCHEDULE (nextDue, freq, triggers) and live event state
        (pendingSince, conditionState) are left untouched, as is everything
        that defines what this home/task/device IS (rooms, devices, tasks,
        template links, customizations, device operating state).
     2. Reset All Data — wipes every home-owned collection back to empty.
        Built-in templates are code (TEMPLATES/DEVICE_TEMPLATES), never
        Firestore data, so they survive by construction. The home doc,
        its membership, and the invite code are kept so a shared home
        isn't destroyed for other members and the owner isn't kicked out.
   Both are idempotent (safe to retry after a failure: deleting an
   already-deleted doc, or re-writing the same reset field values, is a
   no-op) and Firestore-batch-safe via chunked, paginated deletes.
   ===================================================================== */
async function commitInChunks(ops, chunkSize) {
  chunkSize = chunkSize || 400; // stay well under Firestore's 500-op batch limit
  for (let i = 0; i < ops.length; i += chunkSize) {
    const b = db.batch();
    ops.slice(i, i + chunkSize).forEach(fn => fn(b));
    await b.commit();
  }
}
async function deleteCollectionInChunks(colRef, pageSize) {
  pageSize = pageSize || 400;
  // paginated delete: safe for collections of any size, and safe to resume if interrupted —
  // each page that's already gone simply won't be returned by the next query.
  for (;;) {
    const snap = await colRef.limit(pageSize).get();
    if (snap.empty) return;
    const b = db.batch();
    snap.docs.forEach(d => b.delete(d.ref));
    await b.commit();
    if (snap.size < pageSize) return;
  }
}
/* Pure: what Reset Task History writes to ONE task doc.
   HISTORY (reset):   lastCompletedDate, lastCompletedAt.
   SCHEDULE (kept):   nextDue, freq/interval/weekday/monthday, triggerType, isCustomized, templateKey,
                      templateSource, areaId/deviceId, createdAt — never written here.
   CURRENT STATE (kept): pendingSince (afterUse/afterCycle) and conditionState (conditionBased) say
                      "this task is waiting on a real usage/condition event right now" — that's live
                      state, not completion history, so it is preserved and no event is fabricated.
   The ONLY schedule write is a repair for a calendar task that has no valid nextDue at all, and it
   uses the model the app already uses elsewhere (saveTask): next occurrence after the last completion
   if there was one, otherwise the creation-time rule (first on-or-after today). It is never applied
   to a task that already has a valid nextDue, and reset-time is never used as a schedule anchor. */

  await commitInChunks(ops);
  // 2) Clear the history LOGS. Device docs (operatingMode/operatingState/pendingSeasonAction/
  //    appliedKeys/templateVersion) are never touched — only the logs are cleared.
  await deleteCollectionInChunks(hr.collection('taskCompletions'));
  await deleteCollectionInChunks(hr.collection('dailyRoutines'));
  await deleteCollectionInChunks(hr.collection('deviceEvents'));

  // { ...DEFAULTS } whenever this doc doesn't exist.

/* =====================================================================
   Personal Routine Packages — a versioned interchange format, separate
   from the real Task Engine. An external AI (Claude/ChatGPT/Gemini,
   pasted in manually — this app never calls an AI API) suggests tasks
   in this format; the app validates, maps, previews, and only then
   creates them through the SAME task-creation path everything else
   uses (taskFromTpl's conventions: freq, onOrAfter, createdAt, active).
   The AI can never set nextDue/createdAt/lastCompletedDate/an id —
   those fields are stripped during normalization even if present, and
   the app computes them exactly like it does for any new task.
   ===================================================================== */
const PKG_SCHEMA_VERSION = 1;
const PKG_AREA_TYPES = TEMPLATES.map(t => t.key); // ['bedroom','kitchen','bathroom','living','entrance','balcony']
const PKG_DEVICE_TYPES = DEVICE_TEMPLATES.map(t => t.key); // ['ac','dishwasher','fridge','airfryer','vacuum','microwave','stove']
const PKG_TRIGGER_TYPES = ['periodic', 'afterUse', 'afterCycle', 'conditionBased', 'manual'];
const PKG_PRIORITIES = ['high', 'normal', 'low'];
const PKG_FREQ_TYPES = ['daily', 'interval', 'weekly', 'monthly'];

/* ---- 1. Safe extraction: pasted text -> parsed JSON, tolerating ```json fences ---- */
function extractPackageJson(raw) {
  const s = String(raw || '').trim();
  if (!s) return { ok: false, error: 'empty' };
  const fenced = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const candidate = fenced ? fenced[1].trim() : s;
  try { return { ok: true, data: JSON.parse(candidate) }; }
  catch (e) {
    // last resort: grab the outermost {...} in case there's stray prose around it
    const m = candidate.match(/\{[\s\S]*\}/);
    if (m) { try { return { ok: true, data: JSON.parse(m[0]) }; } catch (e2) {} }
    return { ok: false, error: 'parse' };
  }
}

/* ---- 2. Frequency mapping: package format -> internal {unit,n}. Only day/month/weekday/monthday
   exist internally, so this is a closed, total mapping — nothing invented. ---- */
function mapPackageFrequency(f) {
  if (!f || typeof f !== 'object' || !PKG_FREQ_TYPES.includes(f.type)) return { error: 'freqType' };
  if (f.type === 'daily') return { freq: { unit: 'day', n: 1 } };
  if (f.type === 'interval') {
    if (f.unit !== 'day' && f.unit !== 'month') return { error: 'freqUnit' };
    const n = Math.round(+f.n);
    if (!Number.isFinite(n) || n < 1 || n > (f.unit === 'day' ? 365 : 24)) return { error: 'freqRange' };
    return { freq: { unit: f.unit, n } };
  }
  if (f.type === 'weekly') {
    const n = Math.round(+f.weekday);
    if (!Number.isFinite(n) || n < 0 || n > 6) return { error: 'freqRange' };
    return { freq: { unit: 'weekday', n } };
  }
  if (f.type === 'monthly') {
    const n = Math.round(+f.day);
    if (!Number.isFinite(n) || n < 1 || n > 31) return { error: 'freqRange' };
    return { freq: { unit: 'monthday', n } };
  }
  return { error: 'freqType' };
}

/* ---- 3. Structural validation. Blocks entirely on failure — nothing partially imports.
   Unknown/extra fields on a task are ignored, not rejected (spec: "unsupported fields do
   not affect task creation"); invalid VALUES for supported fields ARE rejected. ---- */
function validatePackage(data) {
  const errors = [];
  if (!data || typeof data !== 'object' || Array.isArray(data)) return { ok: false, errors: ['notObject'] };
  if (data.schemaVersion == null) errors.push('missingSchemaVersion');
  else if (data.schemaVersion !== PKG_SCHEMA_VERSION) errors.push('unsupportedSchemaVersion');
  if (data.packageType !== 'personal-routine') errors.push('wrongPackageType');
  if (!Array.isArray(data.tasks)) errors.push('tasksNotArray');
  else if (data.tasks.length === 0) errors.push('noTasks');
  if (errors.length) return { ok: false, errors }; // no point validating individual tasks past this
  const taskErrors = [];
  data.tasks.forEach((t, i) => {
    const e = [];
    if (!t || typeof t !== 'object') { e.push('invalidTask'); taskErrors.push({ index: i, errors: e }); return; }
    if (typeof t.title !== 'string' || !t.title.trim()) e.push('missingTitle');
    else if (t.title.trim().length > 120) e.push('titleTooLong');
    const hasArea = typeof t.areaType === 'string' && t.areaType.trim();
    const hasDevice = typeof t.deviceType === 'string' && t.deviceType.trim();
    if (!hasArea && !hasDevice) e.push('noRoomOrDevice');
    if (hasArea && !PKG_AREA_TYPES.includes(t.areaType)) e.push('unknownRoomType');
    if (hasDevice && !PKG_DEVICE_TYPES.includes(t.deviceType)) e.push('unknownDeviceType');
    const trig = hasDevice ? (t.triggerType == null ? 'periodic' : t.triggerType) : 'periodic';
    if (hasDevice && t.triggerType != null && !PKG_TRIGGER_TYPES.includes(t.triggerType)) e.push('unsupportedTrigger');
    const needsFreq = trig === 'periodic';
    if (needsFreq) { if (mapPackageFrequency(t.frequency).error) e.push('invalidFrequency'); }
    if (!Number.isFinite(+t.estimatedMinutes) || Math.round(+t.estimatedMinutes) < 1 || Math.round(+t.estimatedMinutes) > 240) e.push('invalidMinutes');
    if (t.priority != null && !PKG_PRIORITIES.includes(t.priority)) e.push('invalidPriority');
    if (t.note != null && (typeof t.note !== 'string' || t.note.length > 300)) e.push('invalidNote');
    if (t.reason != null && (typeof t.reason !== 'string' || t.reason.length > 300)) e.push('invalidReason');
    if (e.length) taskErrors.push({ index: i, errors: e });
  });
  if (taskErrors.length) return { ok: false, errors: ['invalidTasks'], taskErrors };
  return { ok: true };
}

/* ---- 4. Normalization: apply defaults, strip anything not on the whitelist (including any
   nextDue/createdAt/lastCompletedDate/id the AI might have tried to invent). ---- */
function normalizePackage(data) {
  return {
    schemaVersion: PKG_SCHEMA_VERSION,
    packageType: 'personal-routine',
    name: (data.metadata && typeof data.metadata.name === 'string' && data.metadata.name.trim()) || tr('personalize.untitledPackage'),
    problems: Array.isArray(data.problems) ? data.problems.map(p => (p && typeof p.description === 'string' ? p.description.trim() : '')).filter(Boolean) : [],
    tasks: data.tasks.map(t => {
      const hasDevice = typeof t.deviceType === 'string' && t.deviceType.trim();
      const triggerType = hasDevice ? (t.triggerType || 'periodic') : null;
      const needsFreq = !hasDevice || triggerType === 'periodic';
      return {
        title: t.title.trim().slice(0, 120),
        areaType: (!hasDevice && typeof t.areaType === 'string') ? t.areaType : null,
        deviceType: hasDevice ? t.deviceType : null,
        triggerType,
        freq: needsFreq ? mapPackageFrequency(t.frequency).freq : null,
        estimatedMinutes: clamp(1, 240, Math.round(+t.estimatedMinutes)),
        priority: PKG_PRIORITIES.includes(t.priority) ? t.priority : 'normal',
        note: typeof t.note === 'string' ? t.note.trim().slice(0, 300) : '',
        reason: typeof t.reason === 'string' ? t.reason.trim().slice(0, 300) : ''
      };
    })
  };
}

/* ---- 5. Room/device mapping: semantic type -> the user's actual areas/devices. Never guesses
   when there's more than one match, never silently attaches to the wrong thing. ---- */
function matchAreasForType(areaType) { return S.areas.filter(a => areaTypeId(a) === areaType); }
function matchDevicesForType(deviceType) { return S.devices.filter(d => d.typeId === deviceType); }
function resolveMapping(task) {
  if (task.deviceType) {
    const m = matchDevicesForType(task.deviceType);
    return { kind: 'device', matches: m, status: m.length === 1 ? 'resolved' : m.length === 0 ? 'unresolved' : 'ambiguous', picked: m.length === 1 ? m[0].id : null };
  }
  const m = matchAreasForType(task.areaType);
  return { kind: 'area', matches: m, status: m.length === 1 ? 'resolved' : m.length === 0 ? 'unresolved' : 'ambiguous', picked: m.length === 1 ? m[0].id : null };
}

/* ---- 6. Duplicate detection: normalized token-overlap, not exact-string matching, scoped to the
   SAME target room/device so unrelated rooms don't produce noisy false positives. Handles simple
   Arabic letter variants (أ/إ/آ->ا, ى->ي, ة->ه) and simple plural-ish prefix matches (toy/toys). ---- */

    .replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')

  'my', 'your', 'with', 'for', 'في', 'من', 'علي', 'الي', 'و', 'ال', 'عن', 'مع', 'بعد', 'قبل', 'كل', 'كده']);

  let hit = 0; for (const x of A) if (B.some(y => tokenMatch(x, y))) hit++;
  return hit / Math.min(A.length, B.length); // overlap coefficient: forgiving for short titles
}
function findPossibleDuplicates(newTitle, candidates, threshold) {
  threshold = threshold || 0.33; // catches spec's own "pick clothes up off the floor" vs "collect scattered clothes" example
  return candidates.map(t => ({ task: t, score: titleSimilarity(newTitle, displayTitle(t)) }))
    .filter(x => x.score >= threshold).sort((a, b) => b.score - a.score).map(x => x.task);
}
function existingTasksInScope(mapping) {
  if (mapping.kind === 'device' && mapping.picked) return S.tasks.filter(t => t.deviceId === mapping.picked);
  if (mapping.kind === 'area' && mapping.picked) return S.tasks.filter(t => t.areaId === mapping.picked);
  return [];
}
/* Built-in template tasks in the target room/device type are ALSO checked (section 21): an AI
   task can duplicate a template task the user hasn't even instantiated as a real task yet. */
function templateDuplicatesForTask(task) {
  const pool = task.deviceType ? (deviceTypeLibrary().find(t => t.id === task.deviceType) || { tasks: [] }).tasks
    : (libraryTypes().find(t => t.id === task.areaType) || { tasks: [] }).tasks;
  return pool.filter(tt => titleSimilarity(task.title, tt.title) >= 0.33).map(tt => tt.title);
}

/* ---- 7. Context snapshot + prompt builder. No Firebase keys/tokens/ids — just type+name+mode,
   exactly the shape section 15 asks for. ---- */
function buildPackageContext() {
  return {
    rooms: S.areas.map(a => ({ type: areaTypeId(a) || 'other', name: a.name })),
    devices: S.devices.map(d => ({ type: d.typeId || 'other', name: d.name, operatingMode: d.operatingMode || 'alwaysActive' }))
  };
}
function buildPersonalizePrompt(problems) {

    tasks: [{
      title: 'Task title', areaType: '(one of the supported room types, OR use deviceType instead)',
      deviceType: '(omit if this is a room task, not a device task)',
      triggerType: '(only for device tasks: periodic | afterUse | afterCycle | conditionBased | manual — omit for room tasks)',
      frequency: { type: 'daily' }, estimatedMinutes: 5, priority: 'normal', note: '', reason: 'why this task addresses the problem above'
    }]
  };
  const lines = [];
  lines.push('You are designing a PERSONAL ROUTINE PACKAGE for a home-cleaning app. Output ONLY a single JSON object matching the schema below — no prose, no markdown fences, nothing else.');
  lines.push('');
  lines.push('# Problems to solve');
  problems.forEach(p => lines.push('- ' + p));
  lines.push('');
  lines.push('# How to think about this');
  lines.push('Understand the underlying behavior first, then design the smallest practical set of tasks that fixes it. Do not just generate generic cleaning tasks. One problem can need more than one task if that is what actually solves it, but avoid excessive micro-tasks.');
  lines.push('');
  lines.push('# Current home');
  lines.push('Rooms: ' + (ctx.rooms.length ? ctx.rooms.map(r => `${r.name} (type: ${r.type})`).join(', ') : 'none yet'));
  lines.push('Devices: ' + (ctx.devices.length ? ctx.devices.map(d => `${d.name} (type: ${d.type}, ${d.operatingMode})`).join(', ') : 'none yet'));
  lines.push('');
  lines.push('# Supported room types (areaType)');
  lines.push(PKG_AREA_TYPES.join(', '));
  lines.push('# Supported device types (deviceType)');
  lines.push(PKG_DEVICE_TYPES.join(', '));
  lines.push('# Supported device trigger types (triggerType, device tasks only)');
  lines.push(PKG_TRIGGER_TYPES.join(', ') + ' — periodic needs "frequency"; the other four must NOT include "frequency".');
  lines.push('# Supported frequency formats');
  lines.push('{"type":"daily"} | {"type":"interval","unit":"day"|"month","n":<number>} | {"type":"weekly","weekday":0-6 (0=Sunday)} | {"type":"monthly","day":1-31}');
  lines.push('');
  lines.push('# Hard rules');
  lines.push('- Every task needs EXACTLY ONE of "areaType" or "deviceType" (a device task may still happen to sit in a room, but the app resolves that from the device itself — do not add areaType to a device task).');
  lines.push('- Use ONLY the room types, device types, trigger types, and frequency formats listed above. Do not invent new ones.');
  lines.push('- Do NOT include "nextDue", "createdAt", "lastCompletedDate", any Firestore document id, or any field not in the schema — the app computes those itself.');
  lines.push('- Do NOT modify or reference existing tasks; this package only proposes NEW tasks.');
  lines.push('- If a room type has more than one matching room in this home (e.g. two bedrooms), still just use the semantic type — the app will ask the user which room during import; do not guess.');
  lines.push('- Before adding a task, briefly check it is not an obvious duplicate of something already implied by an existing room/device in the list above.');
  lines.push('- "estimatedMinutes" must be a realistic integer from 1 to 240. "priority" must be "high", "normal", or "low".');
  lines.push('- Include a short "reason" on every task explaining which problem it addresses.');
  lines.push('');
  lines.push('# Output schema (respond with exactly one JSON object shaped like this)');
  lines.push(JSON.stringify(schemaExample, null, 2));
  return lines.join('\n');
}

/* ---- 8. Task creation: routes through the SAME field conventions taskFromTpl already uses for
   every other new task (freq, onOrAfter(freq, today), active, createdAt) — no parallel engine. ---- */
function taskFromPersonalPackage(task, mapping, pkgMeta, today) {
  const areaId = mapping.kind === 'area' ? mapping.picked : (mapping.deviceAreaId || null);
  const doc = {
    title: task.title, areaId, deviceId: mapping.kind === 'device' ? mapping.picked : null,
    templateKey: null, // deliberately not template-linked: displayTitle() will show the stored title as-is
    templateSource: { category: 'personal-ai', packageName: pkgMeta.name, reason: task.reason || '', generatedAt: FV.serverTimestamp() },
    triggerType: mapping.kind === 'device' ? task.triggerType : null,
    freq: task.freq, estimatedMinutes: task.estimatedMinutes, priority: task.priority, active: true,
    assignedTo: null, note: task.note || '', lastCompletedDate: null, lastCompletedAt: null,
    isCustomized: true, createdAt: FV.serverTimestamp()
  };
  if (doc.freq) doc.nextDue = onOrAfter(doc.freq, today);
  else { doc.nextDue = null; if (task.triggerType === 'afterUse' || task.triggerType === 'afterCycle') doc.pendingSince = null; if (task.triggerType === 'conditionBased') doc.conditionState = 'ok'; }
  return doc;
}

    counts.forEach(({ k, n }) => { const ty = lib.find(t => t.id === k); for (let i = 1; i <= n; i++) plan.push({ name: n === 1 ? ty.name : `${ty.name} ${i}`, icon: ty.icon, typeId: ty.id, tasks: ty.tasks }); });

async function joinHome() {

    case 'tab': S.tab = d.t; S.view = null; render(); window.scrollTo(0, 0); if (d.t === 'stats') loadStats(); break;

    case 'reset-run': runReset(d.a); break;

    case 'pz-goto-import': S.pz.step = 'import'; S.pz.errs = null; render(); break;
    case 'pz-validate': {
      const raw = ($('#pz-json') && $('#pz-json').value) || '';
      S.pz.jsonText = raw;
      const ext = extractPackageJson(raw);
      if (!ext.ok) { S.pz.errs = { kind: 'json' }; render(); break; }
      const v = validatePackage(ext.data);
      if (!v.ok) { S.pz.errs = { kind: 'validate', v }; S.pz.lastRawTasks = Array.isArray(ext.data.tasks) ? ext.data.tasks : null; render(); break; }
      const norm = normalizePackage(ext.data);

        const mapping = resolveMapping(t);
        const existing = mapping.status === 'resolved' ? existingTasksInScope(mapping) : [];
        const dupExisting = existing.length ? findPossibleDuplicates(t.title, existing) : [];
        const dupTemplate = templateDuplicatesForTask(t);
        return { task: t, mapping, dupExisting, dupTemplate, selected: mapping.status === 'resolved', override: null };
      });

      const typeId = t.id;
      try {
        await saveDeviceType({ ...t, tasks }, true); closeSheet();
        const fresh = () => deviceTypeLibrary().find(x => x.id === typeId);
        const n = missingForDevice(fresh() || { ...t, tasks }).length;
        if (n) toast(tr('common.savedInTemplate'), { label: tr('common.addToDevicesN', nDevices(n)), fn: () => syncDeviceType(fresh() || { ...t, tasks }).then(() => toast(tr('common.addedToDevices'))).catch(() => toast(tr('common.couldntAddThem'))) });
        else toast(tr('common.savedInTemplate'));
      } catch (er) { console.error(er); toast(tr('common.couldntSaveTemplate')); }
      break;
    }
    case 'devtt-del': {
      const t = curDeviceType(); if (!t || !confirm(tr('common.confirmDeleteDeviceTaskTpl'))) break;
      try { await saveDeviceType({ ...t, tasks: t.tasks.filter((_, k) => k !== +d.i) }, true); closeSheet(); } catch (er) { toast(tr('common.couldntDeleteTask')); }
      break;
    }
    case 'devtype-sync': {
      const t = curDeviceType(); if (!t) break;
      try { await syncDeviceType(t); toast(tr('common.addedToDevices')); } catch (er) { console.error(er); toast(tr('common.couldntAddThem')); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-sel') { $('#fx').innerHTML = freqExtra(el.value, { unit: 'day', n: el.value === 'weekday' ? new Date().getDay() : 1 }); return; }
  if (el.id === 'lib-search') { S.libSearch = el.value; render(); return; }
  if (el.id === 'pz-file') {
    const f = el.files && el.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { S.pz.jsonText = String(reader.result || ''); S.pz.errs = null; render(); };
    reader.readAsText(f);
    return;
  }
  if (el.dataset.pzPick != null) {
    const i = +el.dataset.pzPick, r = S.pz.resolved[i];
    if (r) { r.override = el.value || null; r.selected = !!r.override; }
    render();
    return;
  }
  if (el.id === 'dtt-trig') {
    const box = $('#dtt-freq'), isCal = CALENDAR_TRIGGERS.has(el.value);
    box.innerHTML = isCal ? `<label class="lbl" for="f-sel">${tr('tasks.repeatEvery')}</label><select id="f-sel" class="in">${PRESETS.filter(p => p[0] !== 'weekday' && p[0] !== 'monthday').map(p => `<option value="${p[0]}" ${p[0] === 'day:7' ? 'selected' : ''}>${tr(p[1])}</option>`).join('')}</select><div id="fx">${freqExtra('day:7', { unit: 'day', n: 7 })}</div>` : `<p class="muted small">${tr('tasks.deviceContext')}</p>`;
    return;
  }
  const s = el.dataset.setting; if (!s) return;
  if (s === 'lang') {
    applyLang(el.value); render();
    try { db.collection('hr_users').doc(S.user.uid).set({ language: S.lang }, { merge: true }); } catch (er) {}
  } else if (s === 'theme') {
    localStorage.setItem('hr-theme', el.value);
    if (el.value === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = el.value;
  } else if (s === 'homeName') {
    const v = el.value.trim(); if (v && isOwner()) homeRef().update({ name: v }).catch(console.error);
  } else settingsRef().set({ [s]: +el.value }, { merge: true }).catch(console.error);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('#auth') && e.target.tagName === 'INPUT') { const b = $('#au-go'); if (b && !b.disabled) b.click(); }
  if (e.key === 'Escape') { if ($('#sheet-bg')) dismissSheet(); }
});

/* =====================================================================
   Mobile gestures: bottom-sheet drag-to-dismiss, tab swipe, wizard swipe.
   All use passive touch listeners so normal scrolling is never blocked;
   a gesture only acts once its own dominant axis/target is confirmed.
   ===================================================================== */
document.addEventListener('input', e => {
  if (e.target.closest('#sheet')) sheetDirty = true;
  if (e.target.id === 'reset-type') { const go = $('#reset-go'); if (go) go.disabled = S.resetBusy || e.target.value !== 'RESET'; }
});
document.addEventListener('change', e => { if (e.target.closest('#sheet')) sheetDirty = true; });

/* -- sheet: drag handle only, so it never fights internal scrolling -- */
let sheetDrag = null;
document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.sheet-handle'); if (!handle) return;
  const sheet = handle.closest('.sheet'); if (!sheet) return;
  sheetDrag = { sheet, startY: e.clientY, dy: 0, id: e.pointerId };
  sheet.style.transition = 'none';
  try { handle.setPointerCapture(e.pointerId); } catch (er) {}
});
document.addEventListener('pointermove', e => {
  if (!sheetDrag || e.pointerId !== sheetDrag.id) return;
  sheetDrag.dy = Math.max(0, e.clientY - sheetDrag.startY);
  sheetDrag.sheet.style.transform = `translateY(${sheetDrag.dy}px)`;
});
function endSheetDrag(e) {
  if (!sheetDrag || e.pointerId !== sheetDrag.id) return;
  const { sheet, dy } = sheetDrag; sheetDrag = null;
  sheet.style.transition = '';
  if (S.resetBusy) { sheet.style.transform = ''; return; } // swipe must never dismiss a running reset
  const fast = dy > 60 && e.timeStamp; // simple distance threshold (velocity not tracked to keep this robust across browsers)
  if (dy > 110) {
    sheet.style.transform = 'translateY(120%)';
    setTimeout(() => {
      if (sheetDirty && !confirm(tr('common.confirmUnsavedClose'))) { sheet.style.transform = ''; return; }
      closeSheet();
    }, 140);
  } else sheet.style.transform = '';
}
document.addEventListener('pointerup', endSheetDrag);
document.addEventListener('pointercancel', endSheetDrag);

/* -- tabs: horizontal swipe between Home/Tasks/Stats/Settings, only on root tab screens -- */
let tabTouch = null;
const TAB_ORDER = ['home', 'tasks', 'stats', 'settings'];
document.addEventListener('touchstart', e => {
  if (S.wz || S.view || $('#sheet-bg') || e.target.closest('.chips, input, textarea, select')) { tabTouch = null; return; }
  const t = e.touches[0]; tabTouch = { x: t.clientX, y: t.clientY, axis: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!tabTouch) return;
  const t = e.touches[0], dx = t.clientX - tabTouch.x, dy = t.clientY - tabTouch.y;
  if (tabTouch.axis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) tabTouch.axis = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y';
  if (tabTouch.axis === 'y') tabTouch = null; // vertical wins: let native scrolling happen untouched
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!tabTouch || tabTouch.axis !== 'x') { tabTouch = null; return; }
  const t = e.changedTouches[0], dx = t.clientX - tabTouch.x; tabTouch = null;
  if (Math.abs(dx) < 55) return;
  const i = TAB_ORDER.indexOf(S.tab); if (i < 0) return;
  const ni = i + (isForwardSwipe(dx) ? 1 : -1);
  if (ni < 0 || ni >= TAB_ORDER.length) return;
  S.tab = TAB_ORDER[ni]; S.view = null; render(); window.scrollTo(0, 0);
  if (S.tab === 'stats') loadStats();
});

/* -- daily wizard: swipe between tasks (RTL/LTR-aware), review only, doesn't change completion state -- */
let wizTouch = null;
document.addEventListener('touchstart', e => {
  if (!S.wz) { wizTouch = null; return; }
  const t = e.touches[0]; wizTouch = { x: t.clientX, y: t.clientY, axis: null };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!wizTouch) return;
  const t = e.touches[0], dx = t.clientX - wizTouch.x, dy = t.clientY - wizTouch.y;
  if (wizTouch.axis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) wizTouch.axis = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y';
  if (wizTouch.axis === 'y') wizTouch = null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!wizTouch || wizTouch.axis !== 'x' || !S.wz) { wizTouch = null; return; }
  const t = e.changedTouches[0], dx = t.clientX - wizTouch.x; wizTouch = null;
  if (Math.abs(dx) < 55) return;
  if (isForwardSwipe(dx)) wizSwipeNext(); else wizSwipePrev();
});

/* =====================================================================
   Boot
   ===================================================================== */
try { const th = localStorage.getItem('hr-theme'); if (th && th !== 'auto') document.documentElement.dataset.theme = th; } catch (e) {}
auth.onAuthStateChanged(async u => {
  cleanup(); S.user = u;
  if (!u) { S.screen = 'auth'; render(); return; }
  S.screen = 'loading'; render();
  try {
    const snap = await db.collection('hr_users').doc(u.uid).get();
    S.profile = snap.exists ? snap.data() : null;
    // Cross-device language sync: only applied on fresh sign-in when no local choice exists on this device yet.
    if (S.profile && S.profile.language && !localStorage.getItem('hr-lang')) applyLang(S.profile.language);
    if (S.profile && S.profile.homeId) startHome(S.profile.homeId);
    else { S.screen = 'setup'; render(); }
  } catch (e) {
    console.error(e);
    S.screen = 'setup'; render();
    toast(e.code === 'permission-denied' ? tr('common.rulesNotPublished') : tr('common.connectionProblem'));
  }
});
</script>
</body>
</html>
